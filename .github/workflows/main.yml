name: Build OnePlus 15 kernel (USER_NS)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "Branch of OnePlusOSS/kernel_manifest (CHECK this exists for sm8850)"
        default: "oneplus/sm8850"
      manifest_file:
        description: "Manifest XML in that branch (CHECK the exact name)"
        default: "oneplus_15.xml"
      platform:
        description: "Platform name passed to oplus_build_kernel.sh (e.g. canoe; CHECK)"
        default: "canoe"
      fork_repo:
        description: "Your kernel fork (owner/name)"
        default: "YOUR_USER/android_kernel_common_oneplus_sm8850"
      fork_branch:
        description: "Branch in your fork"
        default: "oneplus/sm8850_b_16.0.0_oneplus_15"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev zip unzip rsync cpio lz4 xz-utils \
            zstd libxml2-utils
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global color.ui false

      - name: Sync OnePlus kernel platform
        run: |
          mkdir -p ~/kernel && cd ~/kernel
          repo init -u https://github.com/OnePlusOSS/kernel_manifest \
            -b "${{ inputs.manifest_branch }}" -m "${{ inputs.manifest_file }}" \
            --depth=1

          # Some test-tool prebuilts point at a branch that no longer exists
          # upstream and are not needed to build a kernel. Drop them.
          repo manifest -o /tmp/full_manifest.xml
          mkdir -p .repo/local_manifests
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          BAD_REV = "ks-kernel.lnx.5.0.r3-rel"
          KEYWORDS = ("asuite", "tradefed")
          root = ET.parse("/tmp/full_manifest.xml").getroot()
          out = ET.Element("manifest")
          for p in root.iter("project"):
              name = p.get("name") or ""
              path = p.get("path") or name
              rev = p.get("revision") or ""
              if (rev == BAD_REV
                      or any(k in name or k in path for k in KEYWORDS)):
                  print("removing", name, "->", path, rev)
                  ET.SubElement(out, "remove-project", name=name)
          ET.ElementTree(out).write(".repo/local_manifests/skip.xml")
          PY

          for i in 1 2 3; do
            repo sync -c -j4 --no-tags --no-clone-bundle --force-sync \
              --optimized-fetch && break
            echo "sync attempt $i failed, retrying..."
            sleep 20
          done
          du -sh ~/kernel || true

      - name: Swap in your fork of the common kernel
        run: |
          cd ~/kernel/kernel_platform
          rm -rf common
          git clone --depth 1 -b "${{ inputs.fork_branch }}" \
            "https://github.com/${{ inputs.fork_repo }}" common

      - name: Enable user namespaces
        run: |
          cd ~/kernel/kernel_platform/common
          echo "--- before ---"
          grep -rn "USER_NS" arch/arm64/configs/ gki/ 2>/dev/null || true
          f=arch/arm64/configs/gki_defconfig
          # Kleaf requires the defconfig in canonical savedefconfig order:
          # CONFIG_USER_NS goes right after CONFIG_NAMESPACES, and PID_NS
          # (default y) is enabled by deleting its "is not set" line.
          sed -i '/CONFIG_USER_NS[= ]/d; /# CONFIG_USER_NS is not set/d' "$f"
          sed -i '/# CONFIG_PID_NS is not set/d' "$f"
          sed -i '/^CONFIG_NAMESPACES=y$/a CONFIG_USER_NS=y' "$f"
          echo "--- after ---"
          grep -rn "USER_NS" arch/arm64/configs/ gki/ 2>/dev/null || true

      - name: Build
        run: |
          cd ~/kernel
          ./kernel_platform/oplus/build/oplus_build_kernel.sh "${{ inputs.platform }}" gki

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p ~/out
          find ~/kernel -path '*/out/*' \( -name 'Image*' -o -name 'boot*.img' \
            -o -name 'vendor_boot*.img' -o -name 'vendor_dlkm*.img' \
            -o -name 'system_dlkm*' -o -name '.config' \) -type f \
            -exec cp --parents {} ~/out/ \; 2>/dev/null || true
          find ~/out -type f | head -50

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: /home/runner/out
          if-no-files-found: warn
